name: Poll Boxing Odds

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes
  workflow_dispatch:         # Manual trigger

# Grant write permissions to the workflow
permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Debug - list files
        run: |
          pwd
          ls -la
          ls -la utils/ || echo "utils folder not found"
      
      - name: Debug - test Python import
        run: python -c "import requests; print('requests imported successfully')"
      
      - name: Run fetcher
        run: python utils/odds_fetcher.py
        env:
          OPENODDS_API_KEY: ${{ secrets.OPENODDS_API_KEY }}
      
      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/upcoming_fights.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update odds data"
            git push
          fi